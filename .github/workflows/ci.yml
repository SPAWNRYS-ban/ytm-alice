name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    defaults:
      run:
        working-directory: source
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check versions
        run: python3 scripts/check-version.py
      - name: Go tests and vet
        run: |
          go test -race ./...
          go vet ./...
      - name: Python transports and installers
        run: python3 -m unittest discover -v
      - name: Browser cookie parser
        run: node --test test_web_cookies.mjs

  media:
    defaults:
      run:
        working-directory: source
    name: Media tests and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan published source for secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern '*linux_x64.tar.gz' --pattern '*checksums.txt' --dir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact --no-banner

      - name: Rust unit tests
        run: cargo test --locked --manifest-path media/upstream/Cargo.toml

  build:
    defaults:
      run:
        working-directory: source
    name: Station package and binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - name: Validate release source
        run: |
          python3 scripts/check-version.py
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
      - name: Build Go service
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/ytm-alice .
      - name: Build native player without firmware libraries
        run: ./build-native.sh
      - name: Build media integration and collect notices
        run: |
          ./media/upstream/build.sh
          python3 scripts/rust-notices.py
      - name: Build official YAM v2 packer
        run: |
          git clone https://github.com/nyakokitsu/yam.git ../.build/yam
          git -C ../.build/yam checkout 887c9d17f370a89b2d938f5a3369076ff851dfae
          cargo build --locked --release --manifest-path ../.build/yam/Cargo.toml --bin yam
      - name: Pack and verify installation lifecycle
        run: |
          python3 package.py --yam ../.build/yam/target/release/yam --profiles ../.build/yam/platforms
          python3 scripts/check-package.py --yam ../.build/yam/target/release/yam --profiles ../.build/yam/platforms ../release/*.yampkg
      - name: Prepare release assets including standalone binaries
        run: python3 scripts/release-assets.py ../release/*.yampkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, media, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: release
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* --verify-tag --title "ytm-alice ${GITHUB_REF_NAME#v}" --notes-file ../docs/RELEASE.md --latest
